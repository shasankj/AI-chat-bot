# Production stack for a single EC2 host: Caddy (HTTPS) -> app (uvicorn + static UI).
# Usage on the server:  SITE_ADDRESS=<host>.sslip.io docker compose up -d --build
services:
  app:
    build: .
    env_file: backend/.env          # DATABASE_URL, OWNER_DATABASE_URL, ANTHROPIC_API_KEY, SESSION_SECRET, ...
    environment:
      COOKIE_SECURE: "true"
      CORS_ORIGINS: "https://${SITE_ADDRESS}"     # the CSRF Origin check needs the exact public origin
    restart: unless-stopped
    expose: ["8000"]                # reachable by Caddy only, not published to the internet
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      start_period: 60s

  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data            # keeps the TLS certificate across restarts
    depends_on: [app]
    restart: unless-stopped

volumes:
  caddy_data:
